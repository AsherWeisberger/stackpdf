<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Merge, split, and convert PDFs to Word in the browser. Files never leave the tab.">
  <meta name="theme-color" content="#EDE4D4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>StackPDF</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='8' width='14' height='18' rx='2' fill='%23F7EFE3' stroke='%231C1612' stroke-opacity='.2'/%3E%3Crect x='9' y='5' width='14' height='18' rx='2' fill='%23F3E6D0' stroke='%231C1612' stroke-opacity='.2'/%3E%3Crect x='13' y='6' width='14' height='18' rx='2' fill='%23E24B2A'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="mast">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="name">StackPDF</span>
      </div>
      <p class="privacy-chip" title="PDFs are read in this tab. Nothing is uploaded.">
        <span class="lock" aria-hidden="true"></span>
        <span>Stays in this tab</span>
      </p>
    </header>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <main class="stage" id="stage" tabindex="-1" aria-label="PDF drop zone">
      <div class="empty is-enter-stage" id="empty">
        <div class="folio" aria-hidden="true">
          <i class="s1"><b></b><b></b><b></b></i>
          <i class="s2"><b></b><b></b></i>
          <i class="s3">
            <em class="rule"></em>
            <em class="rule"></em>
            <em class="rule"></em>
          </i>
          <span class="seal"><span>This tab<br>only</span></span>
        </div>
        <h1 class="kinetic" aria-label="Stack your PDFs"><span class="k1">Stack</span> <span class="k2">your</span> <span class="k3">PDFs</span></h1>
        <p class="lede">Merge, split, or save as Word.</p>
        <button type="button" class="choose" id="chooseBtn">Add PDFs</button>
      </div>

      <div class="work" id="work" hidden>
        <div class="work-head">
          <p class="count" id="topMeta"></p>
          <button type="button" class="ghost" id="addBtn">Add</button>
        </div>
        <div class="stack" id="stack" role="list" aria-label="PDF stack"></div>
        <section class="pages-panel" id="pagesPanel" hidden>
          <div class="pages-head">
            <div>
              <h2 id="pagesTitle">Pages</h2>
              <p class="pages-sub" id="pagesSub"></p>
            </div>
            <div class="chips" role="group" aria-label="Quick ranges">
              <button type="button" class="chip" id="allPagesBtn">All</button>
              <button type="button" class="chip" id="oddPagesBtn">Odd</button>
              <button type="button" class="chip" id="evenPagesBtn">Even</button>
              <button type="button" class="chip is-quiet" id="clearPagesBtn">Clear</button>
            </div>
          </div>
          <div class="page-grid" id="pageGrid" role="listbox" aria-label="Pages" aria-multiselectable="true"></div>
          <div class="range-row">
            <label class="field">
              <span>Range</span>
              <input type="text" id="rangeInput" placeholder="1–3, 5, 8–10" spellcheck="false" autocomplete="off" aria-describedby="splitHint">
            </label>
            <button type="button" class="text-btn" id="everyBtn" disabled>Every page</button>
          </div>
          <p class="quiet" id="splitHint"></p>
        </section>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="progress-card">
          <p class="progress-label" id="progressLabel">Working</p>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
            <i id="progressBar"></i>
          </div>
        </div>
      </div>
    </main>

    <footer class="dock" id="dock" hidden>
      <p class="dock-note" id="fileHint"></p>
      <p class="dock-note" id="mergeHint" hidden></p>
      <div class="dock-actions">
        <button type="button" class="secondary" id="mergeBtn" disabled>Merge</button>
        <button type="button" class="primary" id="extractBtn" disabled>Extract</button>
        <button type="button" class="tertiary" id="wordBtn" disabled>Word</button>
      </div>
    </footer>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="app.js"></script>
  <script src="word.js"></script>
</body>
</html>
